# MNIST on a single AMD GPU (ROCm).
#
# PyTorch built against ROCm maps AMD GPUs onto the torch.cuda API, so
# `device` is still a normal "cuda" / "cuda:N" string. The `rocm: true` flag
# sets HIP_VISIBLE_DEVICES / ROCR_VISIBLE_DEVICES and enables clearer device
# error messages.
#
# Run from the repo root:
#   python train.py examples/mnist/rocm_single_gpu.yml

model:
  name: examples.mnist.mnist.MNISTClassifier
  args:
    n_hidden: 128
  ckpt_path: null

dataset:
  name: examples.mnist.mnist.MNISTDataset
  args:
    train: true

val_dataset:
  name: examples.mnist.mnist.MNISTDataset
  args:
    train: false

losses:
  cce:
    function_name: cross_entropy_classification_loss
    weight: 1.0
    src_key: pred_logits
    tgt_key: gt_class_id

metrics:
  accuracy:
    function_name: accuracy_classification
    weight: 1.0
    src_key: pred_logits
    tgt_key: gt_class_id

train:
  batch_size: 64
  n_total_steps: 500

  checkpoint_save_frequency: 250
  summary_frequency: 0
  num_eval_every_steps: 250

  save_dir: /tmp/mnist_rocm_single
  device: "cuda:0"

  # --- AMD / ROCm ---
  rocm: true                  # sets HIP_VISIBLE_DEVICES / ROCR_VISIBLE_DEVICES
  n_gpus: 1
  use_ddp: false
  use_bfloat16_autocast: true # MI200+ / MI300 support bf16 natively
  compile_model: false        # torch.compile on ROCm is experimental

  use_tqdm: true
  num_workers: 2

  optimizer:
    name: adam
