model:
  name: examples.mnist.mnist.MNISTClassifier
  args:
    n_hidden: 128
  ckpt_path: null

dataset:
  name: examples.mnist.mnist.MNISTDataset
  args:
    train : true
   

val_dataset:
  name: examples.mnist.mnist.MNISTDataset
  args:
    train: false

losses:

  cce:
    function_name: cross_entropy_classification_loss
    weight: 1.0
    src_key: pred_logits
    tgt_key: gt_class_id

metrics:
  accuracy:
    function_name: accuracy_classification
    weight: 1.0
    src_key: pred_logits
    tgt_key: gt_class_id

train:
  
  n_total_steps: 1000 
  device: cuda
  
  optimizer:
    name: adam
    
